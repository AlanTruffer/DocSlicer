<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocSlicer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f6f8;
      color: #333;
    }

    header {
      background-color: #1e293b;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .preview-area {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e2e8f0;
    }

    .placeholder {
      text-align: center;
      color: #64748b;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <h1>DocSlicer</h1>
    <button id="btn-open-pdf">Cargar PDF</button>
  </header>

  <main>
    <aside class="sidebar">
      <h3>Categorías y Páginas</h3>
      <p id="status-text">Ningún archivo cargado</p>
    </aside>

    <section class="preview-area">
      <div class="placeholder">
        <p>Seleccioná un archivo PDF para comenzar a categorizar y recortar páginas.</p>
      </div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
